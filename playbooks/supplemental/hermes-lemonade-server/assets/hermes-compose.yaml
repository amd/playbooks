name: firecrawl

services:
  hermes:
    image: docker.io/nousresearch/hermes-agent
    container_name: hermes_agent
    command: hermes dashboard
    # We omit the network for the Hermes service to avoid incompatibility,
    # in order for the Hermes dashboard to be accessible outside of the container host.
    network_mode: host
    environment:
      FIRECRAWL_API_KEY: ${FIRECRAWL_API_KEY}
    env_file:
      - .env
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"
        compress: "true"

networks:
  backend:
    driver: bridge

volumes:
  fdb-data:
  fdb-cluster-file:
