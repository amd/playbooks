name: Validate Playbooks

on:
  workflow_dispatch: 
  pull_request:

jobs:
  v2-controller-tests:
    name: V2 Controller Unit Tests (No Hardware)
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - run: python3 -m pip install --quiet pyyaml
      - run: python3 -m unittest discover -s .github/scripts -p 'test_orchestrai_v2.py' -v

  validate-playbooks:
    name: Playbook Structure & Contract Validation
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate playbooks
        run: python .github/scripts/validate_playbooks.py

      - name: Check bug report playbook list is up to date (advisory)
        continue-on-error: true
        run: python .github/scripts/gen_issue_template_playbooks.py --check

      - name: Display summary
        if: success()
        run: |
          echo "### ✅ Playbook Validation Passed" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "All playbooks follow the expected structure and contract." >> $GITHUB_STEP_SUMMARY

