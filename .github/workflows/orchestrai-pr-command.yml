# Copyright Advanced Micro Devices, Inc.
#
# SPDX-License-Identifier: MIT
#
# ChatOps: run a PR's playbooks via OrchestrAI, in English and any localized
# version, and post a sticky pass/fail comment.
#
#   !orc                       -> the playbooks changed in the PR, each in the
#                                 language it changed in
#   !orc all                   -> every playbook, in English
#   !orc a,b,c                 -> the named playbooks, in English
#   !orc a locale=zh-CN        -> a's zh-CN version (en,zh-CN: both; all: English
#                                 and every locale under localized-playbooks/)
#   !orc a device=halo,stx     -> only those devices
#   !orc a platform=linux      -> only that OS
#
# Options combine and may come in any order. Every language of a device and OS
# shares one batch, so one machine (orchestrai_matrix.py). A typo in a playbook,
# locale, device or OS refuses the command with a comment saying why
# (orchestrai_command.py).
#
# Only users with write access (OWNER/MEMBER/COLLABORATOR) can trigger it, since
# it runs internal hardware with the OrchestrAI pipeline secrets. issue_comment runs from the
# default branch, so this file must be on the default branch to take effect.
#
# The controller (.github/scripts and orchestrai-config.yml) always comes from
# this workflow's own revision, the default branch: a PR branch's copy may be
# older or newer than this file expects. The PR head supplies only the
# playbooks under test (the command job's root checkout) and the SHA OrchestrAI
# tests. To try changes to the controller itself, dispatch
# test-playbooks-orchestrai.yml on the branch.
#
# Requires ORCHESTRAI_WAIT_RUNNER (a self-hosted runner label): the Test jobs
# (one per batch) wait for machines and the build, up to 16 h.

name: OrchestrAI PR command

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

# Concurrency applies to every comment, before the job's `if:` filters it, so a
# comment that is not an authorized command gets a group of its own: otherwise
# any "LGTM" would cancel a running !orc. Keep the condition in sync with the
# command job's `if:`.
concurrency:
  group: ${{ (github.event.issue.pull_request && startsWith(github.event.comment.body, '!orc') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)) && format('orchestrai-orc-{0}', github.event.issue.number) || format('orchestrai-orc-ignored-{0}', github.run_id) }}
  cancel-in-progress: true

jobs:
  command:
    name: OrchestrAI PR command
    if: github.event.issue.pull_request && startsWith(github.event.comment.body, '!orc') && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ${{ vars.ORCHESTRAI_CONTROL_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write  # GitHub OIDC token for the OrchestrAI Control Plane CI API
    outputs:
      batch_matrix: ${{ steps.prepare-matrices.outputs.batch_matrix }}
      batches: ${{ steps.prepare-matrices.outputs.batches }}
      has_entries: ${{ steps.prepare-matrices.outputs.has_entries }}
      run_ids: ${{ steps.trigger.outputs.run_ids }}
      run_urls: ${{ steps.trigger.outputs.run_urls }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      head_ref: ${{ steps.pr.outputs.head_ref }}
      filters: ${{ steps.detect.outputs.filters }}
    steps:
      - name: Resolve PR + acknowledge
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$API/repos/$REPO/issues/comments/$COMMENT_ID/reactions" -d '{"content":"eyes"}' >/dev/null || true
          data=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "$API/repos/$REPO/pulls/$PR")
          py() { printf '%s' "$data" | python3 -c "import sys,json;print(json.load(sys.stdin)$1)"; }
          # SECURITY: only same-repo PRs. issue_comment carries the repo secrets
          # even for fork PRs, so allowing forks would let untrusted PR code run
          # on internal hardware with the OrchestrAI pipeline token. Refuse forks outright.
          HEAD_REPO_FULL=$(py "['head']['repo']['full_name']")
          if [ "$HEAD_REPO_FULL" != "$REPO" ]; then
            echo "fork=true" >> "$GITHUB_OUTPUT"
            echo "::warning::OrchestrAI command refused: PR head '$HEAD_REPO_FULL' is a fork of '$REPO'"
            curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "$API/repos/$REPO/issues/$PR/comments" \
              -d '{"body":"🔒 `!orc` is only available for pull requests from branches in this repository, not forks."}' >/dev/null || true
            exit 0
          fi
          {
            echo "fork=false"
            echo "head_sha=$(py "['head']['sha']")"
            echo "base_sha=$(py "['base']['sha']")"
            echo "head_ref=$(py "['head']['ref']")"
            echo "head_repo=$(py "['head']['repo']['clone_url']")"
          } >> "$GITHUB_OUTPUT"

      - if: steps.pr.outputs.fork == 'false'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0

      # The controller, from this workflow's revision (see the header).
      - if: steps.pr.outputs.fork == 'false'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          path: .orc
          persist-credentials: false

      - if: steps.pr.outputs.fork == 'false'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - if: steps.pr.outputs.fork == 'false'
        run: pip install --quiet pyyaml

      - name: Require OrchestrAI config
        if: steps.pr.outputs.fork == 'false'
        env:
          JU: ${{ secrets.ORCHESTRAI_PIPELINE_USER }}
          JT: ${{ secrets.ORCHESTRAI_PIPELINE_TOKEN }}
          WAIT_RUNNER: ${{ vars.ORCHESTRAI_WAIT_RUNNER }}
        run: |
          if [ -z "$JU" ] || [ -z "$JT" ]; then
            echo "::error::OrchestrAI secrets (ORCHESTRAI_PIPELINE_USER/ORCHESTRAI_PIPELINE_TOKEN) are not set"; exit 1
          fi
          if [ -z "$WAIT_RUNNER" ]; then
            echo "::error::Set the repository variable ORCHESTRAI_WAIT_RUNNER to a self-hosted runner label: the Test jobs run up to 12 h"; exit 1
          fi

      # The comment is untrusted: it reaches the parser only through env. The
      # parser runs from the controller checkout, against the PR head's files.
      - name: Parse the command
        id: detect
        if: steps.pr.outputs.fork == 'false'
        env:
          BODY: ${{ github.event.comment.body }}
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
          ORCHESTRAI_DEVICE_TAGS: ${{ vars.ORCHESTRAI_DEVICE_TAGS }}
        run: |
          if ! CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- playbooks localized-playbooks); then
            echo "::error::git diff failed (base $BASE_SHA not in history?)"; exit 1
          fi
          export CHANGED
          python3 .orc/.github/scripts/orchestrai_command.py --config .orc/.github/orchestrai-config.yml

      - name: Say why the command was refused
        if: failure() && steps.detect.outputs.error != ''
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
          ERROR: ${{ steps.detect.outputs.error }}
        run: |
          python3 -I -c '
          import json, os
          body = ("⚠️ `!orc` refused: " + os.environ["ERROR"] + "\n\n"
                  "Usage: `!orc [all | a,b,c] [locale=en,zh-CN|all] [device=halo,stx] [platform=linux|windows]`")
          print(json.dumps({"body": body}))' > "$RUNNER_TEMP/refused.json"
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$API/repos/$REPO/issues/$PR/comments" -d @"$RUNNER_TEMP/refused.json" >/dev/null

      # Every language of a device and OS shares one batch: one OrchestrAI run on
      # one machine. A localized playbook that would execute exactly what its
      # English version in the same batch does is not run again; it reports the
      # English result (orchestrai_matrix.py).
      - name: Build matrix and batches
        id: build-matrix
        if: steps.pr.outputs.fork == 'false'
        env:
          LANGUAGES: ${{ steps.detect.outputs.languages }}
          DEVICES: ${{ steps.detect.outputs.devices }}
          PLATFORMS: ${{ steps.detect.outputs.platforms }}
          ORCHESTRAI_DEVICE_TAGS: ${{ vars.ORCHESTRAI_DEVICE_TAGS }}
        run: python3 .orc/.github/scripts/orchestrai_matrix.py --config .orc/.github/orchestrai-config.yml

      - name: Prepare the batch jobs
        id: prepare-matrices
        if: steps.pr.outputs.fork == 'false'
        env:
          ENGLISH_MATRIX: ${{ steps.build-matrix.outputs.english_matrix }}
          ENGLISH_BATCHES: ${{ steps.build-matrix.outputs.batches }}
          LOCALIZED_MATRIX: ${{ steps.build-matrix.outputs.localized_matrix }}
          LOCALIZED_BATCHES: "{}"  # the batches above hold every language
          BATCH_JOBS: "true"  # one Test job per batch: bound the batch matrix
        run: python3 .orc/.github/scripts/orchestrai_prepare_matrices.py

      - name: Trigger OrchestrAI pipeline builds (PR code)
        id: trigger
        if: steps.pr.outputs.fork == 'false' && steps.prepare-matrices.outputs.has_entries == 'true'
        env:
          BATCHES_JSON: ${{ steps.prepare-matrices.outputs.batches }}
          GIT_REF: ${{ steps.pr.outputs.head_ref }}
          ORCHESTRAI_THEROCK_URL: ${{ vars.ORCHESTRAI_THEROCK_URL }}
          ORCHESTRAI_WINDOWS_THEROCK_URL: ${{ vars.ORCHESTRAI_WINDOWS_THEROCK_URL }}
          ORCHESTRAI_ROCM_MULTI_ARCH_INDEX_URL: ${{ vars.ORCHESTRAI_ROCM_MULTI_ARCH_INDEX_URL }}
          ORCHESTRAI_LINUX_DRIVER_SOURCE: ${{ vars.ORCHESTRAI_LINUX_DRIVER_SOURCE }}
          ORCHESTRAI_LINUX_DRIVER_SOURCES_JSON: ${{ vars.ORCHESTRAI_LINUX_DRIVER_SOURCES_JSON }}
          ORCHESTRAI_RYZENAI_NPU_XRT_URL: ${{ secrets.ORCHESTRAI_RYZENAI_NPU_XRT_URL }}
          ORCHESTRAI_WINDOWS_DRIVER_SOURCE: ${{ secrets.ORCHESTRAI_WINDOWS_DRIVER_SOURCE }}
          ORCHESTRAI_WINDOWS_DRIVER: ${{ vars.ORCHESTRAI_WINDOWS_DRIVER || '' }}
          ORCHESTRAI_WINDOWS_DRIVER_URL: ${{ vars.ORCHESTRAI_WINDOWS_DRIVER_URL }}
          # Test the PR's own code, not the configured repo@main.
          ORCHESTRAI_PLAYBOOK_REPO: ${{ steps.pr.outputs.head_repo }}
          ORCHESTRAI_PLAYBOOK_SHA: ${{ steps.pr.outputs.head_sha }}
          ORCHESTRAI_REPORTING: ${{ vars.ORCHESTRAI_REPORTING || 'reportportal' }}
          ORCHESTRAI_V2_RP_PROJECT: ${{ vars.ORCHESTRAI_V2_RP_PROJECT }}
          ORCHESTRAI_V2_RP_CREDENTIAL: ${{ vars.ORCHESTRAI_V2_RP_CREDENTIAL }}
          ORCHESTRAI_V2_WINDOWS_IMAGE: ${{ vars.ORCHESTRAI_V2_WINDOWS_IMAGE }}
          ORCHESTRAI_V2_LINUX_IMAGE: ${{ vars.ORCHESTRAI_V2_LINUX_IMAGE }}
          ORCHESTRAI_V2_CI_API_URL: ${{ vars.ORCHESTRAI_V2_CI_API_URL }}
          ORCHESTRAI_V2_OIDC_AUDIENCE: ${{ vars.ORCHESTRAI_V2_OIDC_AUDIENCE }}
          ORCHESTRAI_V2_PORTAL_URL: ${{ vars.ORCHESTRAI_V2_PORTAL_URL }}
          ORCHESTRAI_V2_WORKSPACE: ${{ vars.ORCHESTRAI_V2_WORKSPACE }}
        run: python3 .orc/.github/scripts/orchestrai_trigger.py --config .orc/.github/orchestrai-config.yml

      # A newer !orc cancels this one (concurrency above). Runs already started
      # would otherwise keep queueing for or holding machines for hours; the
      # cancel-runs job below covers a cancel after this job has finished. A
      # failed job skips test-batches, so nothing would read its runs either.
      - name: Cancel the OrchestrAI runs this command started
        if: (cancelled() || failure()) && steps.trigger.outputs.run_ids != ''
        timeout-minutes: 15
        env:
          RUN_ID_MAP: ${{ steps.trigger.outputs.run_ids }}
          ORCHESTRAI_V2_CI_API_URL: ${{ vars.ORCHESTRAI_V2_CI_API_URL }}
          ORCHESTRAI_V2_OIDC_AUDIENCE: ${{ vars.ORCHESTRAI_V2_OIDC_AUDIENCE }}
          ORCHESTRAI_V2_PORTAL_URL: ${{ vars.ORCHESTRAI_V2_PORTAL_URL }}
          ORCHESTRAI_V2_WORKSPACE: ${{ vars.ORCHESTRAI_V2_WORKSPACE }}
        run: |
          # -I: the working directory is the PR's checkout; import nothing from it.
          RUN_IDS=$(python3 -I -c 'import json,os; print(" ".join(json.loads(os.environ["RUN_ID_MAP"]).values()))') \
            python3 .orc/.github/scripts/orchestrai_trigger.py --cancel

  test-batches:
    # One job per batch (not per playbook), every language together: it waits
    # on the batch's build once and resolves each playbook from it, as the
    # nightly's batch jobs do (test-playbooks-orchestrai.yml), without their
    # automatic retry: comment !orc again to re-run what did not run. Each job
    # waits for its own batch and prints its progress as it happens.
    name: "${{ matrix.label }} (${{ matrix.count }} playbooks)"
    needs: command
    if: >-
      !cancelled() && needs.command.result == 'success'
      && needs.command.outputs.has_entries == 'true'
    runs-on: ${{ vars.ORCHESTRAI_WAIT_RUNNER }}
    permissions:
      contents: read
      id-token: write  # GitHub OIDC token: poll this batch's OrchestrAI run
    # The Test job waits for its batch to get machines (acquire_timeout, 360 min,
    # + 30 min) and then for the build itself (max_duration, 480 min, + 30):
    # 900 min, plus up to 60 min for checkout, the verdicts and the upload.
    timeout-minutes: 960
    # A batch with no required playbook shows its failures without failing the run.
    continue-on-error: ${{ toJson(matrix.required) == '[]' }}
    # The Control Plane CI API, for every step that reads the batch's run.
    env:
      ORCHESTRAI_V2_CI_API_URL: ${{ vars.ORCHESTRAI_V2_CI_API_URL }}
      ORCHESTRAI_V2_OIDC_AUDIENCE: ${{ vars.ORCHESTRAI_V2_OIDC_AUDIENCE }}
      ORCHESTRAI_V2_PORTAL_URL: ${{ vars.ORCHESTRAI_V2_PORTAL_URL }}
      ORCHESTRAI_V2_WORKSPACE: ${{ vars.ORCHESTRAI_V2_WORKSPACE }}
    strategy:
      fail-fast: false
      # !orc tests every declared device (as many batches as the nightly), and
      # each job holds a wait runner for its batch's whole run: leave the rest
      # of the pool to pull requests (see test-playbooks-orchestrai.yml).
      max-parallel: ${{ fromJson(vars.ORCHESTRAI_MAX_PARALLEL_BATCHES || '8') }}
      matrix:
        include: ${{ fromJson(needs.command.outputs.batch_matrix) }}
    steps:
      # The controller's revision (this workflow's), not the PR head.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      # The wait steps never fail the job by themselves: a batch that got no
      # build resolves as NOT_RUN, and "Batch result" decides the job from the
      # verdicts.
      - name: Wait for the batch's build to start
        id: build
        continue-on-error: true
        # Each batch is handed off as soon as its own build starts, so a batch
        # still queued for machines never holds back the others.
        env:
          RUN_ID: ${{ fromJson(needs.command.outputs.run_ids || '{}')[matrix.batch_id] }}
          BATCH_ID: ${{ matrix.batch_id }}
        run: python3 .github/scripts/orchestrai_trigger.py --await-build

      - name: Wait for OrchestrAI pipeline build
        id: wait
        continue-on-error: true
        env:
          STARTED_BUILD_URL: ${{ steps.build.outputs.build_url }}
          BATCH_ID: ${{ matrix.batch_id }}
          ORCHESTRAI_PIPELINE_USER: ${{ secrets.ORCHESTRAI_PIPELINE_USER }}
          ORCHESTRAI_PIPELINE_TOKEN: ${{ secrets.ORCHESTRAI_PIPELINE_TOKEN }}
          # The live progress follower (orchestrai_follow.py) also reads the run,
          # and the batch's playbooks in plan order to name its sessions.
          RUN_ID: ${{ fromJson(needs.command.outputs.run_ids || '{}')[matrix.batch_id] }}
          FOLLOW_BATCHES: ${{ needs.command.outputs.batches }}
        run: bash .github/scripts/orchestrai_wait_build.sh

      # Each playbook's verdict: PASSED, FAILED, or NOT_RUN/INTERRUPTED
      # (infrastructure: the batch never produced results for it), which the PR
      # comment counts apart from test failures. A localized playbook that ran
      # its English version's tests reports that result. !cancelled(): a
      # cancelled job must reach the cancel step below first.
      - name: Resolve every playbook's verdict
        if: "!cancelled()"
        env:
          BUILD_URL: ${{ steps.wait.outputs.build_url }}
          BATCH_JSON: ${{ toJson(matrix) }}
          RUN_URL: ${{ fromJson(needs.command.outputs.run_urls || '{}')[matrix.batch_id] }}
          JOB_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/job/${{ job.check_run_id }}
          ORCHESTRAI_PIPELINE_USER: ${{ secrets.ORCHESTRAI_PIPELINE_USER }}
          ORCHESTRAI_PIPELINE_TOKEN: ${{ secrets.ORCHESTRAI_PIPELINE_TOKEN }}
          DEFER_EXIT: "1"  # "Batch result" decides the job
        run: python3 .github/scripts/orchestrai_batch_verdict.py

      # A cancelled or timed-out job stops its run: nothing else would, and a
      # queued run would still take machines hours later.
      - name: Cancel this batch's OrchestrAI run
        if: cancelled()
        timeout-minutes: 5
        env:
          RUN_IDS: ${{ fromJson(needs.command.outputs.run_ids || '{}')[matrix.batch_id] }}
        run: python3 .github/scripts/orchestrai_trigger.py --cancel

      - name: Batch result
        if: always()
        env:
          BATCH_JSON: ${{ toJson(matrix) }}
        # Fails only when a required playbook did not pass; with nothing
        # required, when any playbook did not (continue-on-error above).
        run: python3 .github/scripts/orchestrai_batch_verdict.py --exit-code test-results/batch.json

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: batch-results-${{ strategy.job-index }}-${{ matrix.platform }}-${{ matrix.arch }}
          path: test-results/
          if-no-files-found: ignore

  # A cancelled command (a newer !orc, or Cancel workflow) stops every run it
  # started, including batches whose Test jobs never began (max-parallel):
  # nothing else would, and a queued run would still take machines hours later.
  cancel-runs:
    name: Cancel OrchestrAI runs
    needs: [command, test-batches]
    if: cancelled() && needs.command.result == 'success' && needs.command.outputs.run_ids != ''
    runs-on: ${{ vars.ORCHESTRAI_CONTROL_RUNNER || 'ubuntu-latest' }}
    timeout-minutes: 20
    permissions:
      contents: read
      id-token: write  # GitHub OIDC token for the OrchestrAI Control Plane CI API
    steps:
      # The controller's revision (this workflow's), not the PR head.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          persist-credentials: false
      - name: Cancel the runs
        env:
          RUN_ID_MAP: ${{ needs.command.outputs.run_ids }}
          ORCHESTRAI_V2_CI_API_URL: ${{ vars.ORCHESTRAI_V2_CI_API_URL }}
          ORCHESTRAI_V2_OIDC_AUDIENCE: ${{ vars.ORCHESTRAI_V2_OIDC_AUDIENCE }}
          ORCHESTRAI_V2_PORTAL_URL: ${{ vars.ORCHESTRAI_V2_PORTAL_URL }}
          ORCHESTRAI_V2_WORKSPACE: ${{ vars.ORCHESTRAI_V2_WORKSPACE }}
        run: |
          RUN_IDS=$(python3 -c 'import json,os; print(" ".join(json.loads(os.environ["RUN_ID_MAP"]).values()))') \
            python3 .github/scripts/orchestrai_trigger.py --cancel

  report:
    needs: [command, test-batches]
    if: always() && needs.command.result == 'success' && needs.command.outputs.head_sha != ''
    runs-on: ${{ vars.ORCHESTRAI_CONTROL_RUNNER || 'ubuntu-latest' }}
    steps:
      # The controller's revision (this workflow's), not the PR head.
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: batch-results-*
          path: artifacts
        continue-on-error: true

      - name: Build + upsert sticky comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
          HEAD_SHA: ${{ needs.command.outputs.head_sha }}
          HEAD_REF: ${{ needs.command.outputs.head_ref }}
          FILTERS: ${{ needs.command.outputs.filters }}
          # Every batch that should report: one whose job uploaded nothing is
          # reported as not run, never left out.
          EXPECTED_BATCHES: ${{ needs.command.outputs.batch_matrix }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          MARKER='<!-- orchestrai-orc-report -->'
          python3 .github/scripts/orchestrai_report.py --config .github/orchestrai-config.yml \
            --artifacts artifacts --run-url "$RUN_URL" --sha "$HEAD_SHA" --ref "$HEAD_REF" \
            --filters "$FILTERS" > /tmp/body.md
          python3 -c "import json;print(json.dumps({'body':open('/tmp/body.md').read()}))" > /tmp/payload.json
          existing=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "$API/repos/$REPO/issues/$PR/comments?per_page=100" \
            | python3 -c "import sys,json;c=[x for x in json.load(sys.stdin) if str(x.get('body','')).startswith('$MARKER')];print(c[0]['id'] if c else '')")
          if [ -n "$existing" ]; then
            curl -s -X PATCH -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "$API/repos/$REPO/issues/comments/$existing" -d @/tmp/payload.json >/dev/null
          else
            curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "$API/repos/$REPO/issues/$PR/comments" -d @/tmp/payload.json >/dev/null
          fi
          echo "Posted results to PR #$PR"
