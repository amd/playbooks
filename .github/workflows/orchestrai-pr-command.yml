#
# SPDX-License-Identifier: MIT
#
# ChatOps: run canonical or localized PR playbooks via OrchestrAI and post a
# sticky pass/fail comment.
#
#   !orc            -> the playbooks changed in the PR
#   !orc all        -> every playbook
#   !orc a,b,c      -> the named playbooks
#   !localized-orc                     -> changed localized playbooks
#   !localized-orc <locale> all|a,b,c  -> localized playbooks for one locale
#
# Only users with write access (OWNER/MEMBER/COLLABORATOR) can trigger it, since
# it runs internal hardware with the OrchestrAI pipeline secrets. issue_comment runs from the
# default branch, so this file must be on the default branch to take effect.

name: OrchestrAI PR command

on:
  issue_comment:
    types: [created]

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: orchestrai-orc-${{ startsWith(github.event.comment.body, '!localized-orc') && 'localized' || 'english' }}-${{ github.event.issue.number }}
  cancel-in-progress: true

jobs:
  command:
    name: OrchestrAI PR command
    if: github.event.issue.pull_request && (startsWith(github.event.comment.body, '!orc') || startsWith(github.event.comment.body, '!localized-orc')) && contains(fromJSON('["OWNER","MEMBER","COLLABORATOR"]'), github.event.comment.author_association)
    runs-on: ${{ vars.ORCHESTRAI_CONTROL_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      pull-requests: write
      issues: write
      id-token: write  # GitHub OIDC token for the OrchestrAI Control Plane CI API
    outputs:
      matrix: ${{ steps.build-matrix.outputs.matrix }}
      has_entries: ${{ steps.build-matrix.outputs.has_entries }}
      build_urls: ${{ steps.trigger.outputs.build_urls }}
      run_urls: ${{ steps.trigger.outputs.run_urls }}
      head_sha: ${{ steps.pr.outputs.head_sha }}
      head_ref: ${{ steps.pr.outputs.head_ref }}
      locale: ${{ steps.detect.outputs.locale }}
    steps:
      - name: Resolve PR + acknowledge
        id: pr
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
          COMMENT_ID: ${{ github.event.comment.id }}
        run: |
          curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
            "$API/repos/$REPO/issues/comments/$COMMENT_ID/reactions" -d '{"content":"eyes"}' >/dev/null || true
          data=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "$API/repos/$REPO/pulls/$PR")
          py() { printf '%s' "$data" | python3 -c "import sys,json;print(json.load(sys.stdin)$1)"; }
          # SECURITY: only same-repo PRs. issue_comment carries the repo secrets
          # even for fork PRs, so allowing forks would let untrusted PR code run
          # on internal hardware with the OrchestrAI pipeline token. Refuse forks outright.
          HEAD_REPO_FULL=$(py "['head']['repo']['full_name']")
          if [ "$HEAD_REPO_FULL" != "$REPO" ]; then
            echo "fork=true" >> "$GITHUB_OUTPUT"
            echo "::warning::OrchestrAI command refused: PR head '$HEAD_REPO_FULL' is a fork of '$REPO'"
            curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "$API/repos/$REPO/issues/$PR/comments" \
              -d '{"body":"🔒 `!orc` and `!localized-orc` are only available for pull requests from branches in this repository, not forks."}' >/dev/null || true
            exit 0
          fi
          {
            echo "fork=false"
            echo "head_sha=$(py "['head']['sha']")"
            echo "base_sha=$(py "['base']['sha']")"
            echo "head_ref=$(py "['head']['ref']")"
            echo "head_repo=$(py "['head']['repo']['clone_url']")"
          } >> "$GITHUB_OUTPUT"

      - if: steps.pr.outputs.fork == 'false'
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ steps.pr.outputs.head_sha }}
          fetch-depth: 0

      - if: steps.pr.outputs.fork == 'false'
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - if: steps.pr.outputs.fork == 'false'
        run: pip install --quiet pyyaml

      - name: Require OrchestrAI config
        if: steps.pr.outputs.fork == 'false'
        env:
          JU: ${{ secrets.ORCHESTRAI_PIPELINE_USER }}
          JT: ${{ secrets.ORCHESTRAI_PIPELINE_TOKEN }}
        run: |
          if [ -z "$JU" ] || [ -z "$JT" ]; then
            echo "::error::OrchestrAI secrets (ORCHESTRAI_PIPELINE_USER/ORCHESTRAI_PIPELINE_TOKEN) are not set"; exit 1
          fi

      - name: Parse command into playbook list
        id: detect
        if: steps.pr.outputs.fork == 'false'
        env:
          BODY: ${{ github.event.comment.body }}
          BASE_SHA: ${{ steps.pr.outputs.base_sha }}
          HEAD_SHA: ${{ steps.pr.outputs.head_sha }}
        run: |
          if printf '%s' "$BODY" | head -n1 | grep -q '^!localized-orc\([[:space:]]\|$\)'; then
            arg=$(printf '%s' "$BODY" | head -n1 | sed -E 's/^!localized-orc[[:space:]]*//')
            first=$(printf '%s' "$arg" | awk '{print $1}')
            rest=$(printf '%s' "$arg" | sed -E 's/^[^[:space:]]+[[:space:]]*//')
            if [ -n "$rest" ]; then
              LOCALE=$first
              selection=$rest
              if [ ! -d "localized-playbooks/$LOCALE" ]; then
                echo "::error::Localized content directory does not exist: localized-playbooks/$LOCALE"; exit 1
              fi
            elif [ -n "$first" ] && [ -d "localized-playbooks/$first" ]; then
              LOCALE=$first
              selection=
            else
              selection=$arg
              if [ -z "$selection" ]; then
                if ! CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- 'localized-playbooks/*/core/*' 'localized-playbooks/*/supplemental/*'); then
                  echo "::error::git diff failed (base $BASE_SHA not in history?)"; exit 1
                fi
                LOCALES=$(printf '%s\n' "$CHANGED" | sed -nE 's#^localized-playbooks/([^/]+)/(core|supplemental)/[^/]+/.*#\1#p' | sort -u)
              else
                LOCALES=$(find localized-playbooks -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sed 's|localized-playbooks/||' | sort -u)
              fi
              LOCALE_COUNT=$(printf '%s\n' "$LOCALES" | sed '/^$/d' | wc -l | tr -d ' ')
              if [ "$LOCALE_COUNT" -ne 1 ]; then
                echo "::error::Could not select one locale automatically; use !localized-orc <locale> [all|playbook IDs]"; exit 1
              fi
              LOCALE=$(printf '%s\n' "$LOCALES" | sed '/^$/d')
            fi
            if [ "$selection" = "all" ]; then
              PB=$(find "localized-playbooks/$LOCALE/core" "localized-playbooks/$LOCALE/supplemental" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sed "s|localized-playbooks/$LOCALE/[^/]*/||" | sort -u | jq -R -s -c 'split("\n") | map(select(length > 0))')
            elif [ -n "$selection" ]; then
              PB=$(printf '%s' "$selection" | tr ', ' '\n\n' | sed 's/^ *//;s/ *$//' | jq -R -s -c 'split("\n") | map(select(length > 0))')
            else
              if [ -z "${CHANGED+x}" ] && ! CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- "localized-playbooks/$LOCALE/core/*" "localized-playbooks/$LOCALE/supplemental/*"); then
                echo "::error::git diff failed (base $BASE_SHA not in history?)"; exit 1
              fi
              PB=$(printf '%s\n' "$CHANGED" | sed -nE "s#^localized-playbooks/$LOCALE/(core|supplemental)/([^/]+)/.*#\2#p" | sort -u | jq -R -s -c 'split("\n") | map(select(length > 0))')
            fi
          else
            LOCALE=
            arg=$(printf '%s' "$BODY" | head -n1 | sed -E 's/^!orc[[:space:]]*//')
            if [ "$arg" = "all" ]; then
              PB=$(find playbooks/core playbooks/supplemental -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sed 's|playbooks/[^/]*/||' | sort -u | jq -R -s -c 'split("\n") | map(select(length > 0))')
            elif [ -n "$arg" ]; then
              PB=$(printf '%s' "$arg" | tr ', ' '\n\n' | sed 's/^ *//;s/ *$//' | jq -R -s -c 'split("\n") | map(select(length > 0))')
            else
              if ! CHANGED=$(git diff --name-only "$BASE_SHA" "$HEAD_SHA" -- 'playbooks/core/*' 'playbooks/supplemental/*'); then
                echo "::error::git diff failed (base $BASE_SHA not in history?)"; exit 1
              fi
              PB=$(echo "$CHANGED" | grep -E '^playbooks/(core|supplemental)/[^/]+/' | sed 's|playbooks/[^/]*/\([^/]*\)/.*|\1|' | sort -u | jq -R -s -c 'split("\n") | map(select(length > 0))')
            fi
          fi
          echo "locale=$LOCALE" >> "$GITHUB_OUTPUT"
          echo "playbooks=${PB:-[]}" >> "$GITHUB_OUTPUT"

      - name: Build matrix and batches
        id: build-matrix
        if: steps.pr.outputs.fork == 'false'
        env:
          LOCALE: ${{ steps.detect.outputs.locale }}
          PLAYBOOKS: ${{ steps.detect.outputs.playbooks }}
          ORCHESTRAI_DEVICE_TAGS: ${{ vars.ORCHESTRAI_DEVICE_TAGS }}
        run: python3 .github/scripts/orchestrai_matrix.py

      - name: Trigger OrchestrAI pipeline builds (PR code)
        id: trigger
        if: steps.pr.outputs.fork == 'false' && steps.build-matrix.outputs.has_entries == 'true'
        env:
          BATCHES_JSON: ${{ steps.build-matrix.outputs.batches }}
          GIT_REF: ${{ steps.pr.outputs.head_ref }}
          ORCHESTRAI_THEROCK_URL: ${{ vars.ORCHESTRAI_THEROCK_URL }}
          ORCHESTRAI_WINDOWS_THEROCK_URL: ${{ vars.ORCHESTRAI_WINDOWS_THEROCK_URL }}
          ORCHESTRAI_ROCM_MULTI_ARCH_INDEX_URL: ${{ vars.ORCHESTRAI_ROCM_MULTI_ARCH_INDEX_URL }}
          ORCHESTRAI_LINUX_DRIVER_SOURCE: ${{ vars.ORCHESTRAI_LINUX_DRIVER_SOURCE }}
          ORCHESTRAI_LINUX_DRIVER_SOURCES_JSON: ${{ vars.ORCHESTRAI_LINUX_DRIVER_SOURCES_JSON }}
          ORCHESTRAI_RYZENAI_NPU_XRT_URL: ${{ secrets.ORCHESTRAI_RYZENAI_NPU_XRT_URL }}
          ORCHESTRAI_WINDOWS_DRIVER_SOURCE: ${{ secrets.ORCHESTRAI_WINDOWS_DRIVER_SOURCE }}
          ORCHESTRAI_WINDOWS_DRIVER: ${{ vars.ORCHESTRAI_WINDOWS_DRIVER || '' }}
          ORCHESTRAI_WINDOWS_DRIVER_URL: ${{ vars.ORCHESTRAI_WINDOWS_DRIVER_URL }}
          # Test the PR's own code, not the configured repo@main.
          ORCHESTRAI_PLAYBOOK_REPO: ${{ steps.pr.outputs.head_repo }}
          ORCHESTRAI_PLAYBOOK_SHA: ${{ steps.pr.outputs.head_sha }}
          ORCHESTRAI_REPORTING: ${{ vars.ORCHESTRAI_REPORTING || 'reportportal' }}
          ORCHESTRAI_V2_RP_PROJECT: ${{ vars.ORCHESTRAI_V2_RP_PROJECT }}
          ORCHESTRAI_V2_RP_CREDENTIAL: ${{ vars.ORCHESTRAI_V2_RP_CREDENTIAL }}
          ORCHESTRAI_V2_WINDOWS_IMAGE: ${{ vars.ORCHESTRAI_V2_WINDOWS_IMAGE }}
          ORCHESTRAI_V2_LINUX_IMAGE: ${{ vars.ORCHESTRAI_V2_LINUX_IMAGE }}
          ORCHESTRAI_V2_CI_API_URL: ${{ vars.ORCHESTRAI_V2_CI_API_URL }}
          ORCHESTRAI_V2_OIDC_AUDIENCE: ${{ vars.ORCHESTRAI_V2_OIDC_AUDIENCE }}
          ORCHESTRAI_V2_PORTAL_URL: ${{ vars.ORCHESTRAI_V2_PORTAL_URL }}
          ORCHESTRAI_V2_WORKSPACE: ${{ vars.ORCHESTRAI_V2_WORKSPACE }}
        run: python3 .github/scripts/orchestrai_trigger.py

  test-playbooks:
    name: Test
    needs: command
    if: needs.command.outputs.has_entries == 'true'
    uses: ./.github/workflows/orchestrai-test-matrix.yml
    with:
      matrix_json: ${{ needs.command.outputs.matrix }}
      build_urls: ${{ needs.command.outputs.build_urls }}
      run_urls: ${{ needs.command.outputs.run_urls }}
      ref: ${{ needs.command.outputs.head_sha }}
    secrets: inherit

  report:
    needs: [command, test-playbooks]
    if: always() && needs.command.result == 'success' && needs.command.outputs.head_sha != ''
    runs-on: ${{ vars.ORCHESTRAI_CONTROL_RUNNER || 'ubuntu-latest' }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          ref: ${{ needs.command.outputs.head_sha }}
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          path: artifacts
        continue-on-error: true

      - name: Build + upsert sticky comment
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          API: ${{ github.api_url }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.issue.number }}
          HEAD_SHA: ${{ needs.command.outputs.head_sha }}
          HEAD_REF: ${{ needs.command.outputs.head_ref }}
          LOCALE: ${{ needs.command.outputs.locale }}
          RUN_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}
        run: |
          REPORT_ARGS=()
          MARKER='<!-- orchestrai-orc-report -->'
          if [ -n "$LOCALE" ]; then
            REPORT_ARGS+=(--locale "$LOCALE")
            MARKER='<!-- orchestrai-localized-orc-report -->'
          fi
          python3 .github/scripts/orchestrai_report.py "${REPORT_ARGS[@]}" \
            --artifacts artifacts --run-url "$RUN_URL" --sha "$HEAD_SHA" --ref "$HEAD_REF" > /tmp/body.md
          python3 -c "import json;print(json.dumps({'body':open('/tmp/body.md').read()}))" > /tmp/payload.json
          existing=$(curl -s -H "Authorization: Bearer $GH_TOKEN" "$API/repos/$REPO/issues/$PR/comments?per_page=100" \
            | python3 -c "import sys,json;c=[x for x in json.load(sys.stdin) if str(x.get('body','')).startswith('$MARKER')];print(c[0]['id'] if c else '')")
          if [ -n "$existing" ]; then
            curl -s -X PATCH -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "$API/repos/$REPO/issues/comments/$existing" -d @/tmp/payload.json >/dev/null
          else
            curl -s -X POST -H "Authorization: Bearer $GH_TOKEN" -H "Accept: application/vnd.github+json" \
              "$API/repos/$REPO/issues/$PR/comments" -d @/tmp/payload.json >/dev/null
          fi
          echo "Posted results to PR #$PR"
