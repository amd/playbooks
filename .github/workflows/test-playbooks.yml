name: Test Playbooks

on:
  schedule:
    - cron: '0 8 * * *'    # 01:00 PDT (UTC-7); 02:00 PST (UTC-8)
  workflow_dispatch:
    inputs:
      locale:
        description: 'Localized locale to test alongside English'
        required: true
        default: 'zh-CN'
        type: string
      playbook_id:
        description: 'Specific English/localized playbook ID (leave empty to test all)'
        required: false
        type: string
      platform:
        description: 'Restrict to one OS (leave "all" for every OS the playbook supports)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - linux
          - windows
      device:
        description: 'Restrict to one device (leave "all" for every device the playbook supports)'
        required: false
        default: 'all'
        type: choice
        options:
          - all
          - halo
          - grgh
          - mdsh
          - stx
          - krk
          - grgp
          - mdsp
          - r9700
          - rx7900xt
          - rx9070xt
      runner_label:
        description: 'Extra runner label to target one specific self-hosted runner (e.g. its hostname/IP/alias label). Use ONLY when platform ≠ all && device ≠ all. Leave empty to let GitHub pick any matching runner.'
        required: false
        type: string
  pull_request:

permissions:
  contents: read
  # Required so the failure-reporting step can open issues on behalf of the
  # workflow. Note we still gate the issue creation step itself on
  # github.ref == 'refs/heads/main' so PR runs never create issues.
  issues: write

jobs:
  detect-changes:
    name: Detect Changed Playbooks
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      english_matrix: ${{ steps.build-matrix.outputs.english_matrix }}
      localized_matrix: ${{ steps.build-matrix.outputs.localized_matrix }}
      has_english_entries: ${{ steps.build-matrix.outputs.has_english_entries }}
      has_localized_entries: ${{ steps.build-matrix.outputs.has_localized_entries }}
      detection_ok: ${{ steps.build-matrix.outputs.detection_ok }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      # Pin Python so the builder's tarfile filter="data" (3.12+) is always
      # available; matches the selector-tests job.
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      # Build independently bounded canonical English and localized matrices.
      # English selection uses extracted test signatures; localized selection
      # conservatively tracks the effective overlay and dependency trees.
      # Event data goes through env, never inline, so PR-controlled strings
      # (playbook ids, device names) cannot reach the shell directly.
      - name: Build test matrix
        id: build-matrix
        env:
          PLAYBOOK_INPUT: ${{ github.event.inputs.playbook_id }}
          PLATFORM_INPUT: ${{ github.event.inputs.platform }}
          DEVICE_INPUT: ${{ github.event.inputs.device }}
          RUNNER_LABEL_INPUT: ${{ github.event.inputs.runner_label }}
          LOCALE: ${{ inputs.locale || 'zh-CN' }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          # workflow_dispatch filters. These inputs only exist on manual runs;
          # on pull_request / cron they are empty and no filter is applied.
          # Assembled into an array so PR-safe env values are never re-split.
          filters=()
          if [ -n "$PLATFORM_INPUT" ] && [ "$PLATFORM_INPUT" != "all" ]; then
            filters+=(--platform "$PLATFORM_INPUT")
          fi
          if [ -n "$DEVICE_INPUT" ] && [ "$DEVICE_INPUT" != "all" ]; then
            filters+=(--device "$DEVICE_INPUT")
          fi
          if [ -n "$RUNNER_LABEL_INPUT" ]; then
            filters+=(--runner-label "$RUNNER_LABEL_INPUT")
          fi

          if [ -n "$PLAYBOOK_INPUT" ]; then
            args=(--mode playbook --playbook-id "$PLAYBOOK_INPUT")
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            args=(--mode changed --base "$PR_BASE_SHA")
          else
            args=(--mode all)
          fi
          ENGLISH=$(python3 .github/scripts/build_test_matrix.py "${args[@]}" "${filters[@]}" --allow-empty)
          LOCALIZED=$(python3 .github/scripts/build_test_matrix.py "${args[@]}" "${filters[@]}" --locale "$LOCALE" --allow-empty)
          if [ "$ENGLISH" = "[]" ] && [ "$LOCALIZED" = "[]" ] && { [ -n "$PLAYBOOK_INPUT" ] || [ "$EVENT_NAME" = "workflow_dispatch" ]; }; then
            echo "::error::No English or $LOCALE matrix entries match the requested playbook/filter combination"
            exit 1
          fi
          ENGLISH_MATRIX="$ENGLISH" \
          ENGLISH_BATCHES='{}' \
          LOCALIZED_MATRIX="$LOCALIZED" \
          LOCALIZED_BATCHES='{}' \
          python3 .github/scripts/orchestrai_prepare_matrices.py
          echo "detection_ok=true" >> "$GITHUB_OUTPUT"

      - name: Display test matrices
        env:
          ENGLISH_MATRIX: ${{ steps.build-matrix.outputs.english_matrix }}
          LOCALIZED_MATRIX: ${{ steps.build-matrix.outputs.localized_matrix }}
        run: |
          echo "English test matrix: $ENGLISH_MATRIX"
          echo "Localized test matrix: $LOCALIZED_MATRIX"

  # Guards the selector itself: a false negative here silently stops testing
  # playbooks, so these run on every PR before anything is skipped.
  selector-tests:
    name: Test Selection Regression Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # real-commit replay needs history
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run selection regression tests
        run: python3 .github/scripts/test_build_test_matrix.py
      - name: Run playbook-test extractor tests
        run: python3 .github/scripts/test_run_playbook_tests.py
      - name: Run prereq validator tests
        run: python3 .github/scripts/test_prereq_validate.py

  test-playbooks:
    name: Test
    needs: detect-changes
    if: needs.detect-changes.outputs.has_english_entries == 'true'
    uses: ./.github/workflows/native-test-matrix.yml
    with:
      matrix_json: ${{ needs.detect-changes.outputs.english_matrix }}
    secrets: inherit

  test-localized-playbooks:
    name: "Test [localized]"
    needs: detect-changes
    if: needs.detect-changes.outputs.has_localized_entries == 'true'
    uses: ./.github/workflows/native-test-matrix.yml
    with:
      matrix_json: ${{ needs.detect-changes.outputs.localized_matrix }}
    secrets: inherit

  test-gate:
    name: Test Gate (Required Tests)
    needs: [detect-changes, selector-tests, test-playbooks, test-localized-playbooks]
    if: always()
    runs-on: ubuntu-latest
    steps:
      # An empty matrix and a crashed matrix builder both leave test-playbooks
      # 'skipped', so the gate must check detection succeeded before treating
      # "nothing ran" as success.
      - name: Check required tests
        run: |
          echo "detect-changes result: ${{ needs.detect-changes.result }} (detection_ok=${{ needs.detect-changes.outputs.detection_ok }})"
          echo "selector-tests result: ${{ needs.selector-tests.result }}"
          echo "English playbooks result: ${{ needs.test-playbooks.result }}"
          echo "Localized playbooks result: ${{ needs.test-localized-playbooks.result }}"
          if [ "${{ needs.selector-tests.result }}" != "success" ]; then
            echo "::error::Test-selection regression tests failed; skip decisions cannot be trusted"
            exit 1
          fi
          if [ "${{ needs.detect-changes.result }}" != "success" ] || [ "${{ needs.detect-changes.outputs.detection_ok }}" != "true" ]; then
            echo "::error::Could not determine which tests to run; refusing to pass"
            exit 1
          fi
          if [ "${{ needs.detect-changes.outputs.has_english_entries }}" = "true" ] \
             && [ "${{ needs.test-playbooks.result }}" != "success" ]; then
            echo "::error::Required English tests did not complete successfully"
            exit 1
          fi
          if [ "${{ needs.detect-changes.outputs.has_localized_entries }}" = "true" ] \
             && [ "${{ needs.test-localized-playbooks.result }}" != "success" ]; then
            echo "::error::Required localized tests did not complete successfully"
            exit 1
          fi
          echo "All required tests passed (or no tests were needed)"
