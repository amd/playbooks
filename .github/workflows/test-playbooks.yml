# The checks of the playbook test tooling that need no hardware. The playbooks
# themselves are tested on hardware through OrchestrAI:
# test-playbooks-orchestrai.yml (each PR, nightly, manual) and `!orc` on a PR.
name: Playbook Test Tooling

on:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  # Guards the selector itself: a false negative here silently stops testing
  # playbooks, so these run on every PR before anything is skipped.
  selector-tests:
    name: Test Selection Regression Tests
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0    # real-commit replay needs history
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Run selection regression tests
        run: python3 .github/scripts/test_build_test_matrix.py
      - name: Run playbook-test extractor tests
        run: python3 .github/scripts/test_run_playbook_tests.py
      - name: Run prereq validator tests
        run: python3 .github/scripts/test_prereq_validate.py

  # The playbook runner drives Windows PowerShell 5.1 (powershell.exe) on the
  # Windows machines; Ubuntu only has pwsh 7, so the 5.1 setup checks run here.
  powershell-setup-tests:
    name: PowerShell Setup Tests (Windows PowerShell 5.1)
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.13'
      - name: Check powershell.exe is Windows PowerShell 5.1
        run: powershell -NoProfile -Command 'if ($PSVersionTable.PSVersion.Major -ne 5) { exit 1 }'
      - name: Run PowerShell setup tests
        shell: bash
        working-directory: .github/scripts
        # Fail on any skip: every test in the class, including the execution-policy one, must run here.
        run: |
          python -m unittest -v test_run_playbook_tests.PowerShellSetupFailureTest 2>&1 | tee unittest.log
          ! grep -q "skipped" unittest.log

  test-gate:
    name: Test Gate (Required Tests)
    needs: [selector-tests, powershell-setup-tests]
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Check required tests
        run: |
          echo "selector-tests result: ${{ needs.selector-tests.result }}"
          echo "PowerShell setup tests result: ${{ needs.powershell-setup-tests.result }}"
          if [ "${{ needs.powershell-setup-tests.result }}" != "success" ]; then
            echo "::error::PowerShell setup tests failed on Windows PowerShell 5.1"
            exit 1
          fi
          if [ "${{ needs.selector-tests.result }}" != "success" ]; then
            echo "::error::Test-selection regression tests failed; skip decisions cannot be trusted"
            exit 1
          fi
          echo "All required tests passed"
