name: Stamp Playbook Dates

# Keeps published_date / updated_date in each playbook.json in sync with git
# history. published_date is set once (first commit that added the playbook);
# updated_date is refreshed to the latest commit. Runs after a push to main
# that touches playbooks/, then commits any changes back with [skip ci].
#
# Pure git + JSON on ubuntu-latest — no self-hosted runner, so it can't be
# wedged by an offline device runner.

on:
  push:
    branches: [main]
    paths:
      - 'playbooks/**'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: stamp-playbook-dates-${{ github.ref }}
  # Newest-wins: a fresh push supersedes an older still-running stamp instead of
  # queuing behind it, so one slow run can't backlog the pipeline.
  cancel-in-progress: true

jobs:
  stamp:
    name: Stamp playbook dates
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0    # full history: first/last commit dates per playbook

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.13'

      - name: Stamp dates from git history
        run: python .github/scripts/stamp_playbook_dates.py

      - name: Open a PR if dates changed
        # main is a protected branch (changes must go through a PR), so the bot
        # cannot push to main directly. Push the stamped files to a side branch
        # and open a PR, matching translate-playbooks.yml.
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain playbooks)" ]; then
            echo "No date changes to commit."
            exit 0
          fi
          BRANCH="chore/stamp-playbook-dates-${{ github.run_id }}"
          git config user.name "amd-playbooks-bot"
          git config user.email "amd-playbooks-bot@users.noreply.github.com"
          git checkout -b "$BRANCH"
          git add playbooks/**/playbook.json
          git commit -m "chore: stamp playbook published/updated dates"
          git push origin "$BRANCH"
          gh pr create --repo "${{ github.repository }}" \
            --base "${{ github.ref_name }}" --head "$BRANCH" \
            --title "chore: stamp playbook published/updated dates" \
            --body "Automated: published_date / updated_date in playbook.json were out of sync with git history. Stamped by the Stamp Playbook Dates workflow (run ${{ github.run_id }})."
