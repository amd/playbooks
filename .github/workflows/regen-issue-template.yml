name: Regenerate Issue Template

# Keeps the issue forms' generated dropdowns (the bug-report playbook list, and
# the AMD-hardware list in both forms) in sync with their sources on disk. A
# playbook PR no longer has to hand-regenerate the forms (the
# validate-playbooks check for it is advisory only). Runs after a push to main
# that touches playbooks/ or the device registry, then opens a PR with any
# change.
#
# Pure git + Python on ubuntu-latest — no self-hosted runner, so it can't be
# wedged by an offline device runner.

on:
  push:
    branches: [main]
    paths:
      - 'playbooks/**'
      - '.github/scripts/device_registry.json'
      - '.github/scripts/gen_issue_template_playbooks.py'
      - '.github/ISSUE_TEMPLATE/**'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write

concurrency:
  group: regen-issue-template-${{ github.ref }}
  # Newest-wins: a fresh push supersedes an older still-running regen instead of
  # queuing behind it, so one slow run can't backlog the pipeline.
  cancel-in-progress: true

jobs:
  regen:
    name: Regenerate issue template
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Regenerate issue-form dropdowns
        run: python .github/scripts/gen_issue_template_playbooks.py

      - name: Open a PR if the template changed
        # main is a protected branch (changes must go through a PR), so the bot
        # cannot push to main directly. Push the regenerated file to a side
        # branch and open a PR, matching translate-playbooks.yml.
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -z "$(git status --porcelain .github/ISSUE_TEMPLATE/)" ]; then
            echo "Issue templates already up to date."
            exit 0
          fi
          # Fixed branch so each run updates one PR instead of opening another.
          BRANCH="chore/regen-issue-template"
          git config user.name "amd-playbooks-bot"
          git config user.email "amd-playbooks-bot@users.noreply.github.com"
          # -B resets the branch onto this run's main.
          git checkout -B "$BRANCH"
          git add .github/ISSUE_TEMPLATE/
          git commit -m "chore: regenerate issue-form dropdowns"
          # Plain --force: the shallow checkout has no lease ref for this branch.
          git push --force origin "$BRANCH"
          PR_URL=$(gh pr list --repo "${{ github.repository }}" --head "$BRANCH" \
              --state open --json url --jq '.[0].url // empty')
          if [ -n "$PR_URL" ]; then
            echo "PR already open for $BRANCH ($PR_URL); branch updated."
            gh pr comment "$PR_URL" \
              --body "Refreshed by run ${{ github.run_id }}; this PR now reflects the latest \`playbooks/\` and \`.github/scripts/device_registry.json\` on \`main\`." \
              || echo "::warning::Could not comment on $PR_URL."
          else
            gh pr create --repo "${{ github.repository }}" \
              --base "${{ github.ref_name }}" --head "$BRANCH" \
              --title "chore: regenerate issue-form dropdowns" \
              --body "Automated: a generated issue-form dropdown was out of sync with its source: \`playbooks/\` or \`.github/scripts/device_registry.json\`. Regenerated by the Regenerate Issue Template workflow (run ${{ github.run_id }})."
          fi
