# TEMPORARY / DO NOT MERGE.
# Repurposes the existing "Runner Heartbeat" workflow_dispatch entry to read
# the exact gfx (LLVM ISA) target off the x-ultra (Gorgon Halo) runner, so the
# device_to_gfx value in orchestrai-config.yml can be set correctly. Read-only.
# Select this branch when dispatching. main's real heartbeat is unaffected.
name: Runner Heartbeat

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  gfx:
    name: Detect gfx target on x-ultra
    timeout-minutes: 10
    runs-on: [self-hosted, x-ultra]
    steps:
      - name: Read gfx target
        shell: bash
        run: |
          echo "===== x-ultra gfx detection ====="
          echo "host: $(hostname 2>/dev/null || echo unknown)"
          echo

          echo "----- rocminfo (gfx nodes) -----"
          if command -v rocminfo >/dev/null 2>&1; then
            rocminfo 2>/dev/null | grep -iE "Name:.*gfx|Marketing Name|gfx[0-9]" || echo "no gfx line in rocminfo"
          else
            echo "rocminfo not found"
          fi
          echo

          echo "----- rocm-smi product/gfx -----"
          if command -v rocm-smi >/dev/null 2>&1; then
            rocm-smi --showproductname 2>/dev/null || echo "rocm-smi --showproductname failed"
          else
            echo "rocm-smi not found"
          fi
          echo

          echo "----- amdgpu sysfs isa nodes -----"
          # The kernel exposes the ISA per node here; most reliable when rocminfo is absent.
          for f in /sys/class/kfd/kfd/topology/nodes/*/properties; do
            [ -f "$f" ] && grep -iH "gfx_target_version\|simd_count" "$f" 2>/dev/null || true
          done
          echo

          echo "----- clinfo fallback -----"
          if command -v clinfo >/dev/null 2>&1; then
            clinfo 2>/dev/null | grep -iE "gfx[0-9]|Board name|Device Name" | head || echo "no gfx in clinfo"
          else
            echo "clinfo not found"
          fi
          echo "===== end ====="
