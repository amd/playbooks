#
# SPDX-License-Identifier: MIT
#
# OrchestrAI playbook CI (opt-in, additive).
#
# Runs each playbook on real AMD hardware through the OrchestrAI Control Plane
# instead of on a device-attached GitHub runner. Detect & Trigger starts one run
# per hardware batch with a GitHub OIDC token; each Test job waits on its batch's
# pipeline build and reports that playbook's result. Settings and access rules:
# .github/orchestrai-config.yml.
#
# Required repo secrets:   ORCHESTRAI_PIPELINE_USER, ORCHESTRAI_PIPELINE_TOKEN
#   (read the pipeline builds; the workflow no-ops on a fork without them)
# Required repo variables: ORCHESTRAI_V2_CI_API_URL, ORCHESTRAI_V2_OIDC_AUDIENCE,
#   ORCHESTRAI_V2_PORTAL_URL, ORCHESTRAI_V2_WORKSPACE, and for ReportPortal
#   reporting ORCHESTRAI_V2_RP_CREDENTIAL / ORCHESTRAI_V2_RP_PROJECT.
#   ORCHESTRAI_WAIT_RUNNER: a self-hosted runner label. Each Test job waits for
#   its batch's machines and build, and for one retry of each, up to 24 h;
#   GitHub-hosted runners stop a job at 6 h.
# Optional repo variables: ORCHESTRAI_REPORTING (reportportal|api, for runs
#                          without inputs; default reportportal)
#                          ORCHESTRAI_CONTROL_RUNNER (default ubuntu-latest)
# Required for Linux Radeon batches: ORCHESTRAI_LINUX_DRIVER_SOURCE points to
# the approved amdgpu-install package held in repository configuration.
# Required for ROCm Python dependencies: ORCHESTRAI_ROCM_MULTI_ARCH_INDEX_URL
# points to the approved multi-architecture wheel index.
# Required for default Windows provisioning: ORCHESTRAI_WINDOWS_DRIVER_URL
# pins the released Adrenalin installer. ORCHESTRAI_WINDOWS_DRIVER=internal
# explicitly opts back into ORCHESTRAI_WINDOWS_DRIVER_SOURCE (internal share).
# All other settings live in .github/orchestrai-config.yml.

name: Test Playbooks (OrchestrAI)

on:
  schedule:
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      locale:
        description: 'Locale to test (leave empty for canonical English)'
        required: false
        type: string
      playbook_id:
        description: 'Playbook ID(s), comma-separated (empty = all)'
        required: false
        type: string
      device:
        description: 'Device(s) to test on, comma-separated e.g. stx,halo (empty = all declared devices)'
        required: false
        type: string
      platform:
        description: 'OS to test on'
        required: false
        type: choice
        default: all
        options:
          - all
          - linux
          - windows
      machines_per_hw_group:
        description: 'Machines per hardware group, capped at its playbook count (1 = share one machine; use 1 for full runs, more doubles quota use)'
        required: false
        type: string
        default: '1'
      windows_driver:
        description: 'Windows driver: default uses repo setting (released Adrenalin); internal uses the build share'
        required: false
        type: choice
        default: default
        options:
          - default
          - public
          - internal
      reporting:
        description: 'Results: reportportal (also export to ReportPortal) or api (OrchestrAI only)'
        type: choice
        default: api
        options:
          - api
          - reportportal
      playbook_ref:
        description: 'amd/playbooks branch, tag or commit to test'
        type: string
        default: main
  # No pull_request trigger: PR runs are opt-in, not automatic on every push, to
  # keep the shared hardware fleet from being flooded. To test a PR, comment
  # `!orc` or `!localized-orc` on it (see orchestrai-pr-command.yml) — that runs
  # the PR's own head commit on demand. Re-enable auto-runs by adding a
  # `pull_request:` block here;
  # the detect step already handles the pull_request event (changed-playbooks
  # diff) and the trigger step already sets PLAYBOOK_REPO/SHA from the PR head.

permissions:
  contents: read

# Don't pile up runs on the shared hardware fleet: one run per ref, and cancel
# superseded PR runs (but never cancel an in-flight scheduled/dispatch run).
concurrency:
  # Include the event so a scheduled run and a manual dispatch on the same ref
  # don't serialize behind each other; PRs still group by PR number.
  group: orchestrai-${{ github.workflow }}-${{ github.event_name }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  detect-and-trigger:
    name: Detect & Trigger
    runs-on: ${{ vars.ORCHESTRAI_CONTROL_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
      id-token: write  # GitHub OIDC token for the OrchestrAI Control Plane CI API
    outputs:
      english_matrix: ${{ steps.prepare-matrices.outputs.english_matrix }}
      batch_matrix: ${{ steps.prepare-matrices.outputs.batch_matrix }}
      batches: ${{ steps.prepare-matrices.outputs.batches }}
      localized_matrix: ${{ steps.prepare-matrices.outputs.localized_matrix }}
      has_entries: ${{ steps.prepare-matrices.outputs.has_entries }}
      run_ids: ${{ steps.trigger.outputs.run_ids }}
      run_urls: ${{ steps.trigger.outputs.run_urls }}
      unconfirmed: ${{ steps.trigger.outputs.unconfirmed }}
      playbook_repo: ${{ steps.trigger.outputs.playbook_repo }}
      playbook_sha: ${{ steps.trigger.outputs.playbook_sha }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
        with:
          fetch-depth: 0

      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        with:
          python-version: '3.12'

      - name: Install deps
        run: pip install --quiet pyyaml

      - name: Check OrchestrAI is configured
        id: gate
        env:
          JU: ${{ secrets.ORCHESTRAI_PIPELINE_USER }}
          JT: ${{ secrets.ORCHESTRAI_PIPELINE_TOKEN }}
        run: |
          if [ -n "$JU" ] && [ -n "$JT" ]; then
            echo "enabled=true" >> "$GITHUB_OUTPUT"
          else
            echo "enabled=false" >> "$GITHUB_OUTPUT"
            echo "::notice::OrchestrAI secrets (ORCHESTRAI_PIPELINE_USER/ORCHESTRAI_PIPELINE_TOKEN) not set — skipping OrchestrAI run."
          fi

      - name: Detect English and localized playbooks
        id: detect
        if: steps.gate.outputs.enabled == 'true'
        # Pass event data via env (not inline ${{ }}) so untrusted strings never
        # reach the shell directly.
        env:
          PLAYBOOK_INPUT: ${{ github.event.inputs.playbook_id }}
          LOCALE_INPUT: ${{ inputs.locale }}
          EVENT_NAME: ${{ github.event_name }}
          PR_BASE_SHA: ${{ github.event.pull_request.base.sha }}
          HEAD_SHA: ${{ github.sha }}
        run: |
          if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
            LOCALE="$LOCALE_INPUT"
            if [ -n "$LOCALE" ] && { [[ ! "$LOCALE" =~ ^[A-Za-z0-9]+(-[A-Za-z0-9]+)*$ ]] || [ ! -d "localized-playbooks/$LOCALE" ]; }; then
              echo "::error::Localized content directory does not exist: localized-playbooks/$LOCALE"
              exit 1
            fi
          else
            # Automated runs preserve the existing combined English + zh-CN coverage.
            LOCALE="zh-CN"
          fi

          if [ -n "$PLAYBOOK_INPUT" ]; then
            SELECTED=$(echo "$PLAYBOOK_INPUT" | tr ',' '\n' | sed 's/^ *//;s/ *$//' | jq -R -s -c 'split("\n") | map(select(length > 0))')
            if [ "$EVENT_NAME" = "workflow_dispatch" ]; then
              if [ -n "$LOCALE" ]; then
                ENGLISH=[]
                LOCALIZED=$SELECTED
              else
                ENGLISH=$SELECTED
                LOCALIZED=[]
              fi
            else
              ENGLISH=$SELECTED
              LOCALIZED=$SELECTED
            fi
          elif [ "$EVENT_NAME" = "pull_request" ]; then
            if ! CHANGED=$(git diff --name-only "$PR_BASE_SHA" "$HEAD_SHA" -- 'playbooks/core/*' 'playbooks/supplemental/*'); then
              echo "::error::git diff failed (base $PR_BASE_SHA not in history?) — cannot determine changed playbooks"; exit 1
            fi
            ENGLISH=$(echo "$CHANGED" | grep -E '^playbooks/(core|supplemental)/[^/]+/' | sed 's|playbooks/[^/]*/\([^/]*\)/.*|\1|' | sort -u | jq -R -s -c 'split("\n") | map(select(length > 0))')
            if ! LOCALIZED_CHANGED=$(git diff --name-only "$PR_BASE_SHA" "$HEAD_SHA" -- "localized-playbooks/$LOCALE/core/*" "localized-playbooks/$LOCALE/supplemental/*"); then
              echo "::error::git diff failed for localized playbooks"; exit 1
            fi
            LOCALIZED=$(echo "$LOCALIZED_CHANGED" | grep -E "^localized-playbooks/$LOCALE/(core|supplemental)/[^/]+/" | sed "s|localized-playbooks/$LOCALE/[^/]*/\([^/]*\)/.*|\1|" | sort -u | jq -R -s -c 'split("\n") | map(select(length > 0))')
          else
            if [ "$EVENT_NAME" = "workflow_dispatch" ] && [ -z "$LOCALE" ]; then
              ENGLISH=$(find playbooks/core playbooks/supplemental -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sed 's|playbooks/[^/]*/||' | sort -u | jq -R -s -c 'split("\n") | map(select(length > 0))')
              LOCALIZED=[]
            elif [ "$EVENT_NAME" = "workflow_dispatch" ]; then
              ENGLISH=[]
              LOCALIZED=$(find "localized-playbooks/$LOCALE/core" "localized-playbooks/$LOCALE/supplemental" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sed "s|localized-playbooks/$LOCALE/[^/]*/||" | sort -u | jq -R -s -c 'split("\n") | map(select(length > 0))')
            else
              ENGLISH=$(find playbooks/core playbooks/supplemental -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sed 's|playbooks/[^/]*/||' | sort -u | jq -R -s -c 'split("\n") | map(select(length > 0))')
              LOCALIZED=$(find "localized-playbooks/$LOCALE/core" "localized-playbooks/$LOCALE/supplemental" -mindepth 1 -maxdepth 1 -type d 2>/dev/null | sed "s|localized-playbooks/$LOCALE/[^/]*/||" | sort -u | jq -R -s -c 'split("\n") | map(select(length > 0))')
            fi
          fi
          echo "english=${ENGLISH:-[]}" >> "$GITHUB_OUTPUT"
          echo "localized=${LOCALIZED:-[]}" >> "$GITHUB_OUTPUT"
          echo "locale=$LOCALE" >> "$GITHUB_OUTPUT"

      - name: Build English matrix and batches
        id: build-english
        if: steps.gate.outputs.enabled == 'true'
        env:
          PLAYBOOKS: ${{ steps.detect.outputs.english }}
          ORCHESTRAI_DEVICE_TAGS: ${{ vars.ORCHESTRAI_DEVICE_TAGS }}
          DEVICES: ${{ inputs.device }}
          PLATFORMS: ${{ inputs.platform }}
        run: python3 .github/scripts/orchestrai_matrix.py

      - name: Build localized matrix and batches
        id: build-localized
        if: steps.gate.outputs.enabled == 'true'
        env:
          LOCALE: ${{ steps.detect.outputs.locale }}
          PLAYBOOKS: ${{ steps.detect.outputs.localized }}
          ORCHESTRAI_DEVICE_TAGS: ${{ vars.ORCHESTRAI_DEVICE_TAGS }}
          DEVICES: ${{ inputs.device }}
          PLATFORMS: ${{ inputs.platform }}
        run: python3 .github/scripts/orchestrai_matrix.py

      - name: Prepare English and localized matrices
        id: prepare-matrices
        if: steps.gate.outputs.enabled == 'true'
        env:
          ENGLISH_MATRIX: ${{ steps.build-english.outputs.matrix }}
          ENGLISH_BATCHES: ${{ steps.build-english.outputs.batches }}
          LOCALIZED_MATRIX: ${{ steps.build-localized.outputs.matrix }}
          LOCALIZED_BATCHES: ${{ steps.build-localized.outputs.batches }}
          BATCH_JOBS: "true"  # one Test job per batch: bound the batch matrix
        run: python3 .github/scripts/orchestrai_prepare_matrices.py

      # Checked before anything is reserved: the Test jobs outlive a
      # GitHub-hosted runner's 6 h limit.
      - name: Require a self-hosted wait runner
        if: steps.gate.outputs.enabled == 'true' && steps.prepare-matrices.outputs.has_entries == 'true'
        env:
          WAIT_RUNNER: ${{ vars.ORCHESTRAI_WAIT_RUNNER }}
        run: |
          if [ -z "$WAIT_RUNNER" ]; then
            echo "::error::Set the repository variable ORCHESTRAI_WAIT_RUNNER to a self-hosted runner label: the Test jobs run up to 24 h"; exit 1
          fi

      - name: Trigger OrchestrAI pipeline builds
        id: trigger
        if: steps.gate.outputs.enabled == 'true' && steps.prepare-matrices.outputs.has_entries == 'true'
        env:
          BATCHES_JSON: ${{ steps.prepare-matrices.outputs.batches }}
          GIT_REF: ${{ github.ref }}
          MACHINES_PER_HW_GROUP: ${{ github.event.inputs.machines_per_hw_group || '' }}
          ORCHESTRAI_THEROCK_URL: ${{ vars.ORCHESTRAI_THEROCK_URL }}
          ORCHESTRAI_WINDOWS_THEROCK_URL: ${{ vars.ORCHESTRAI_WINDOWS_THEROCK_URL }}
          ORCHESTRAI_ROCM_MULTI_ARCH_INDEX_URL: ${{ vars.ORCHESTRAI_ROCM_MULTI_ARCH_INDEX_URL }}
          ORCHESTRAI_LINUX_DRIVER_SOURCE: ${{ vars.ORCHESTRAI_LINUX_DRIVER_SOURCE }}
          # Optional per-release amdgpu map; overrides the single URL above on
          # hosts whose release has an entry.
          ORCHESTRAI_LINUX_DRIVER_SOURCES_JSON: ${{ vars.ORCHESTRAI_LINUX_DRIVER_SOURCES_JSON }}
          ORCHESTRAI_RYZENAI_NPU_XRT_URL: ${{ secrets.ORCHESTRAI_RYZENAI_NPU_XRT_URL }}
          ORCHESTRAI_WINDOWS_DRIVER_SOURCE: ${{ secrets.ORCHESTRAI_WINDOWS_DRIVER_SOURCE }}
          ORCHESTRAI_WINDOWS_DRIVER: ${{ (inputs.windows_driver != 'default' && inputs.windows_driver) || vars.ORCHESTRAI_WINDOWS_DRIVER || '' }}
          ORCHESTRAI_WINDOWS_DRIVER_URL: ${{ vars.ORCHESTRAI_WINDOWS_DRIVER_URL }}
          # On a pull_request, test the PR's OWN code (same as the !orc path),
          # not the configured repo@main. These are empty on schedule/dispatch, so
          # orchestrai_trigger.py tests playbook_repo@playbook_ref there. Fork PRs
          # never reach this step: the secret gate above is false without secrets.
          ORCHESTRAI_PLAYBOOK_REPO: ${{ github.event.pull_request.head.repo.clone_url }}
          ORCHESTRAI_PLAYBOOK_SHA: ${{ github.event.pull_request.head.sha }}
          ORCHESTRAI_PLAYBOOK_REF: ${{ inputs.playbook_ref }}
          # reportportal (default, also the nightly) or api; the repo variable
          # sets it for runs without inputs.
          ORCHESTRAI_REPORTING: ${{ inputs.reporting || vars.ORCHESTRAI_REPORTING || 'reportportal' }}
          ORCHESTRAI_V2_RP_PROJECT: ${{ vars.ORCHESTRAI_V2_RP_PROJECT }}
          ORCHESTRAI_V2_RP_CREDENTIAL: ${{ vars.ORCHESTRAI_V2_RP_CREDENTIAL }}
          ORCHESTRAI_V2_WINDOWS_IMAGE: ${{ vars.ORCHESTRAI_V2_WINDOWS_IMAGE }}
          ORCHESTRAI_V2_LINUX_IMAGE: ${{ vars.ORCHESTRAI_V2_LINUX_IMAGE }}
          ORCHESTRAI_V2_CI_API_URL: ${{ vars.ORCHESTRAI_V2_CI_API_URL }}
          ORCHESTRAI_V2_OIDC_AUDIENCE: ${{ vars.ORCHESTRAI_V2_OIDC_AUDIENCE }}
          ORCHESTRAI_V2_PORTAL_URL: ${{ vars.ORCHESTRAI_V2_PORTAL_URL }}
          ORCHESTRAI_V2_WORKSPACE: ${{ vars.ORCHESTRAI_V2_WORKSPACE }}
        run: python3 .github/scripts/orchestrai_trigger.py

  test-batches:
    # One job per batch (not per playbook), English and localized alike: it waits
    # on the batch's build once and resolves each playbook from it, so a full run
    # needs ~1 runner per batch instead of one per playbook, and several runs no
    # longer starve each other.
    name: "${{ matrix.label }} (${{ matrix.count }} playbooks)"
    needs: detect-and-trigger
    if: needs.detect-and-trigger.outputs.has_entries == 'true'
    runs-on: ${{ vars.ORCHESTRAI_WAIT_RUNNER }}
    permissions:
      contents: read
      id-token: write  # GitHub OIDC token: poll this batch's OrchestrAI run
    # Each attempt waits for machines (acquire_timeout 360 min + 30) and then for
    # the build (330 min): up to 720 min. The retry starts only while a whole
    # attempt still fits (RETRY_START_LIMIT_MINUTES below), so the job stays
    # within 24 h, the GITHUB_TOKEN's lifetime.
    timeout-minutes: 1440
    # A batch with no required playbook shows its failures without failing the run.
    continue-on-error: ${{ toJson(matrix.required) == '[]' }}
    strategy:
      fail-fast: false
      matrix:
        include: ${{ fromJson(needs.detect-and-trigger.outputs.batch_matrix) }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0

      - name: Record the job's start
        run: echo "JOB_START=$(date +%s)" >> "$GITHUB_ENV"

      # The wait steps never fail the job by themselves: a batch that got no build
      # resolves as NOT_RUN, which the retry may recover, and "Batch result"
      # decides the job from the final verdicts.
      - name: Wait for the batch's build to start
        id: build
        continue-on-error: true
        env:
          RUN_ID: ${{ fromJson(needs.detect-and-trigger.outputs.run_ids || '{}')[matrix.batch_id] }}
          BATCH_ID: ${{ matrix.batch_id }}
          ORCHESTRAI_V2_CI_API_URL: ${{ vars.ORCHESTRAI_V2_CI_API_URL }}
          ORCHESTRAI_V2_OIDC_AUDIENCE: ${{ vars.ORCHESTRAI_V2_OIDC_AUDIENCE }}
          ORCHESTRAI_V2_PORTAL_URL: ${{ vars.ORCHESTRAI_V2_PORTAL_URL }}
          ORCHESTRAI_V2_WORKSPACE: ${{ vars.ORCHESTRAI_V2_WORKSPACE }}
        run: python3 .github/scripts/orchestrai_trigger.py --await-build

      - name: Wait for OrchestrAI pipeline build
        id: wait
        continue-on-error: true
        env:
          STARTED_BUILD_URL: ${{ steps.build.outputs.build_url }}
          BATCH_ID: ${{ matrix.batch_id }}
          ORCHESTRAI_PIPELINE_USER: ${{ secrets.ORCHESTRAI_PIPELINE_USER }}
          ORCHESTRAI_PIPELINE_TOKEN: ${{ secrets.ORCHESTRAI_PIPELINE_TOKEN }}
        run: bash .github/scripts/orchestrai_wait_build.sh

      # !cancelled(): a cancelled job must reach the cancel step below without
      # first resolving the whole batch against a pipeline that may not answer.
      - name: Resolve every playbook's verdict
        if: "!cancelled()"
        env:
          BUILD_URL: ${{ steps.wait.outputs.build_url }}
          BATCH_JSON: ${{ toJson(matrix) }}
          RUN_URL: ${{ fromJson(needs.detect-and-trigger.outputs.run_urls || '{}')[matrix.batch_id] }}
          JOB_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/job/${{ job.check_run_id }}
          ORCHESTRAI_PIPELINE_USER: ${{ secrets.ORCHESTRAI_PIPELINE_USER }}
          ORCHESTRAI_PIPELINE_TOKEN: ${{ secrets.ORCHESTRAI_PIPELINE_TOKEN }}
          DEFER_EXIT: "1"  # the job's result is decided after the retry below
        run: python3 .github/scripts/orchestrai_batch_verdict.py

      # One new OrchestrAI run, usually on another machine, for the playbooks that
      # provably never executed (orchestrai_verdict.RETRY_CAUSES: no build, or
      # planned but never started) -- never a failed test, a test cut off
      # mid-run (a hang looks the same as a lost machine), or results that could
      # not be read. And only when the first run has certainly ended: its build
      # was seen to finish (a wait that gave up proves nothing), and the Control
      # Plane reports the run terminal and not cancelled, with no build the job
      # did not see (that build may have run them). Anything less is
      # reported and left alone, so two runs never hold the same playbooks.
      # Repo variable ORCHESTRAI_RETRY_NOT_RUN=false turns this off. The retry
      # steps use !cancelled(), not always(): a cancelled or timed-out job must
      # never reserve hardware for a new run.
      - name: Pick playbooks to retry
        id: pick
        if: '!cancelled() && vars.ORCHESTRAI_RETRY_NOT_RUN != ''false'''
        env:
          BATCHES: ${{ needs.detect-and-trigger.outputs.batches }}
          BATCH_ID: ${{ matrix.batch_id }}
          FIRST_BUILD_URL: ${{ steps.build.outputs.build_url }}
          FIRST_WAIT: ${{ steps.wait.outcome }}
          FIRST_UNCONFIRMED: ${{ contains(fromJson(needs.detect-and-trigger.outputs.unconfirmed || '[]'), matrix.batch_id) }}
          RUN_ID: ${{ fromJson(needs.detect-and-trigger.outputs.run_ids || '{}')[matrix.batch_id] }}
          ORCHESTRAI_V2_CI_API_URL: ${{ vars.ORCHESTRAI_V2_CI_API_URL }}
          ORCHESTRAI_V2_OIDC_AUDIENCE: ${{ vars.ORCHESTRAI_V2_OIDC_AUDIENCE }}
          ORCHESTRAI_V2_PORTAL_URL: ${{ vars.ORCHESTRAI_V2_PORTAL_URL }}
          ORCHESTRAI_V2_WORKSPACE: ${{ vars.ORCHESTRAI_V2_WORKSPACE }}
          # 1440 - a whole attempt (720) - time to resolve, upload and report.
          RETRY_START_LIMIT_MINUTES: 660
        run: |
          retry=$(python3 .github/scripts/orchestrai_batch_verdict.py --retryable test-results/batch.json 2>/dev/null || true)
          if [ -z "$retry" ]; then echo "Nothing to retry"; exit 0; fi
          names=$(tr "\n" " " <<< "$retry")
          skip() { echo "::warning::Not retrying ${names}: $1"; echo "> ⚠️ Not retrying ${names}: $1" >> "$GITHUB_STEP_SUMMARY"; exit 0; }
          elapsed=$(( ($(date +%s) - JOB_START) / 60 ))
          if [ "$elapsed" -gt "$RETRY_START_LIMIT_MINUTES" ]; then
            skip "${elapsed} min have passed and a retry can take 720 more"
          fi
          if [ "$FIRST_UNCONFIRMED" = "true" ]; then
            skip "the first run's start got no definite answer; it may have started"
          fi
          if [ -n "$FIRST_BUILD_URL" ] && [ "$FIRST_WAIT" != "success" ]; then
            skip "the first build was not seen to finish (${FIRST_BUILD_URL}); it may still be running"
          fi
          status_file=$(mktemp)
          GITHUB_OUTPUT="$status_file" python3 .github/scripts/orchestrai_trigger.py --run-status || true
          status=$(sed -n 's/^status=//p' "$status_file")
          run_build=$(sed -n 's/^build_url=//p' "$status_file")
          case "$status" in
            never_started|passed|failed|unstable|error) ;;
            cancelled) skip "the first run was cancelled" ;;
            "") skip "the first run's state could not be read; it may still be queued or running" ;;
            *) skip "the first run is still ${status}" ;;
          esac
          # A build this job never saw (the wait gave up or could not read the
          # run) may have run these playbooks: report them, never run them twice.
          if [ -z "$FIRST_BUILD_URL" ] && [ -n "$run_build" ]; then
            skip "the first run started a build this job did not see (${run_build}); they may have run there"
          fi
          echo "Retrying (did not run): $(tr "\n" " " <<< "$retry")"
          RETRY="$retry" python3 - <<'PY' >> "$GITHUB_OUTPUT"
          import json, os
          batch = json.loads(os.environ["BATCHES"])[os.environ["BATCH_ID"]]
          batch["playbooks"] = os.environ["RETRY"].split()
          print("batches_json=" + json.dumps({os.environ["BATCH_ID"]: batch}))
          print("playbooks=" + json.dumps(batch["playbooks"]))
          PY

      # The trigger reads orchestrai-config.yml (PyYAML); Detect & Trigger's
      # install does not reach this job.
      # Preparing the retry never fails the job: if it fails, nothing is
      # submitted and the first attempt's results stand.
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6.3.0
        id: retry_python
        continue-on-error: true
        if: "!cancelled() && steps.pick.outputs.batches_json != ''"
        with:
          python-version: '3.12'

      - name: Install the trigger's dependencies
        id: retry_deps
        continue-on-error: true
        if: "!cancelled() && steps.retry_python.outcome == 'success'"
        run: pip install --quiet pyyaml

      - name: Retry them in a new OrchestrAI run
        id: retry_trigger
        continue-on-error: true
        if: "!cancelled() && steps.retry_deps.outcome == 'success'"
        env:
          BATCHES_JSON: ${{ steps.pick.outputs.batches_json }}
          ORCHESTRAI_RETRY: "1"
          GIT_REF: ${{ github.ref }}
          MACHINES_PER_HW_GROUP: ${{ github.event.inputs.machines_per_hw_group || '' }}
          ORCHESTRAI_THEROCK_URL: ${{ vars.ORCHESTRAI_THEROCK_URL }}
          ORCHESTRAI_WINDOWS_THEROCK_URL: ${{ vars.ORCHESTRAI_WINDOWS_THEROCK_URL }}
          ORCHESTRAI_ROCM_MULTI_ARCH_INDEX_URL: ${{ vars.ORCHESTRAI_ROCM_MULTI_ARCH_INDEX_URL }}
          ORCHESTRAI_LINUX_DRIVER_SOURCE: ${{ vars.ORCHESTRAI_LINUX_DRIVER_SOURCE }}
          ORCHESTRAI_LINUX_DRIVER_SOURCES_JSON: ${{ vars.ORCHESTRAI_LINUX_DRIVER_SOURCES_JSON }}
          ORCHESTRAI_RYZENAI_NPU_XRT_URL: ${{ secrets.ORCHESTRAI_RYZENAI_NPU_XRT_URL }}
          ORCHESTRAI_WINDOWS_DRIVER_SOURCE: ${{ secrets.ORCHESTRAI_WINDOWS_DRIVER_SOURCE }}
          ORCHESTRAI_WINDOWS_DRIVER: ${{ (inputs.windows_driver != 'default' && inputs.windows_driver) || vars.ORCHESTRAI_WINDOWS_DRIVER || '' }}
          ORCHESTRAI_WINDOWS_DRIVER_URL: ${{ vars.ORCHESTRAI_WINDOWS_DRIVER_URL }}
          # The repository and commit the first attempt resolved, never the ref
          # again: on a schedule, main may have moved since.
          ORCHESTRAI_PLAYBOOK_REPO: ${{ needs.detect-and-trigger.outputs.playbook_repo }}
          ORCHESTRAI_PLAYBOOK_SHA: ${{ needs.detect-and-trigger.outputs.playbook_sha }}
          ORCHESTRAI_REPORTING: ${{ inputs.reporting || vars.ORCHESTRAI_REPORTING || 'reportportal' }}
          ORCHESTRAI_V2_RP_PROJECT: ${{ vars.ORCHESTRAI_V2_RP_PROJECT }}
          ORCHESTRAI_V2_RP_CREDENTIAL: ${{ vars.ORCHESTRAI_V2_RP_CREDENTIAL }}
          ORCHESTRAI_V2_WINDOWS_IMAGE: ${{ vars.ORCHESTRAI_V2_WINDOWS_IMAGE }}
          ORCHESTRAI_V2_LINUX_IMAGE: ${{ vars.ORCHESTRAI_V2_LINUX_IMAGE }}
          ORCHESTRAI_V2_CI_API_URL: ${{ vars.ORCHESTRAI_V2_CI_API_URL }}
          ORCHESTRAI_V2_OIDC_AUDIENCE: ${{ vars.ORCHESTRAI_V2_OIDC_AUDIENCE }}
          ORCHESTRAI_V2_PORTAL_URL: ${{ vars.ORCHESTRAI_V2_PORTAL_URL }}
          ORCHESTRAI_V2_WORKSPACE: ${{ vars.ORCHESTRAI_V2_WORKSPACE }}
        run: |
          if [ -z "$ORCHESTRAI_PLAYBOOK_SHA" ]; then
            echo "::error::Detect & Trigger recorded no playbook commit; not retrying"; exit 1
          fi
          python3 .github/scripts/orchestrai_trigger.py

      # The rest of the retry runs only for an actual retry run of this batch,
      # and its results replace the first attempt's only when it got a build.
      - name: Wait for the retry's build to start
        id: retry_build
        continue-on-error: true
        if: "!cancelled() && fromJson(steps.retry_trigger.outputs.run_ids || '{}')[matrix.batch_id]"
        env:
          RUN_ID: ${{ fromJson(steps.retry_trigger.outputs.run_ids || '{}')[matrix.batch_id] }}
          BATCH_ID: ${{ matrix.batch_id }}
          ORCHESTRAI_V2_CI_API_URL: ${{ vars.ORCHESTRAI_V2_CI_API_URL }}
          ORCHESTRAI_V2_OIDC_AUDIENCE: ${{ vars.ORCHESTRAI_V2_OIDC_AUDIENCE }}
          ORCHESTRAI_V2_PORTAL_URL: ${{ vars.ORCHESTRAI_V2_PORTAL_URL }}
          ORCHESTRAI_V2_WORKSPACE: ${{ vars.ORCHESTRAI_V2_WORKSPACE }}
        run: python3 .github/scripts/orchestrai_trigger.py --await-build

      - name: Wait for the retry's build
        id: retry_wait
        continue-on-error: true
        if: "!cancelled() && steps.retry_build.outputs.build_url != ''"
        env:
          STARTED_BUILD_URL: ${{ steps.retry_build.outputs.build_url }}
          BATCH_ID: ${{ matrix.batch_id }}
          ORCHESTRAI_PIPELINE_USER: ${{ secrets.ORCHESTRAI_PIPELINE_USER }}
          ORCHESTRAI_PIPELINE_TOKEN: ${{ secrets.ORCHESTRAI_PIPELINE_TOKEN }}
        run: bash .github/scripts/orchestrai_wait_build.sh

      - name: Resolve the retried playbooks
        id: retry_resolve
        continue-on-error: true
        if: "!cancelled() && steps.retry_build.outputs.build_url != ''"
        env:
          BUILD_URL: ${{ steps.retry_wait.outputs.build_url }}
          BATCH_JSON: ${{ toJson(matrix) }}
          RETRY_PLAYBOOKS: ${{ steps.pick.outputs.playbooks }}
          RUN_URL: ${{ fromJson(steps.retry_trigger.outputs.run_urls || '{}')[matrix.batch_id] }}
          JOB_URL: ${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}/job/${{ job.check_run_id }}
          ORCHESTRAI_PIPELINE_USER: ${{ secrets.ORCHESTRAI_PIPELINE_USER }}
          ORCHESTRAI_PIPELINE_TOKEN: ${{ secrets.ORCHESTRAI_PIPELINE_TOKEN }}
          DEFER_EXIT: "1"
        run: |
          cp test-results/batch.json "$RUNNER_TEMP/attempt1.json"
          BATCH_JSON=$(python3 -c 'import json,os; b=json.loads(os.environ["BATCH_JSON"]); b["playbooks"]=json.loads(os.environ["RETRY_PLAYBOOKS"]); print(json.dumps(b))') \
          RETRY_OF="$RUNNER_TEMP/attempt1.json" python3 .github/scripts/orchestrai_batch_verdict.py

      - name: Record a retry that produced no results
        if: "!cancelled() && steps.pick.outputs.batches_json != '' && steps.retry_resolve.outcome != 'success'"
        env:
          RETRY_PLAYBOOKS: ${{ steps.pick.outputs.playbooks }}
          # The first step that did not succeed: preparation, submission, or the build.
          STAGE: >-
            ${{ steps.retry_deps.outcome != 'success' && 'could not be prepared'
            || !fromJson(steps.retry_trigger.outputs.run_ids || '{}')[matrix.batch_id] && 'was not accepted by OrchestrAI'
            || steps.retry_build.outputs.build_url == '' && 'got no build'
            || 'could not be resolved' }}
        run: |
          msg="Retry of $(python3 -c 'import json,os; print(", ".join(json.loads(os.environ["RETRY_PLAYBOOKS"])))') ${STAGE}; their first attempt's results stand"
          echo "::warning::${msg}"
          echo "> ⚠️ ${msg}" >> "$GITHUB_STEP_SUMMARY"

      # A cancelled or timed-out job stops its runs: nothing else would, and a
      # queued run would still take machines hours later.
      - name: Cancel this batch's OrchestrAI runs
        if: cancelled()
        timeout-minutes: 5
        env:
          RUN_IDS: ${{ fromJson(needs.detect-and-trigger.outputs.run_ids || '{}')[matrix.batch_id] }} ${{ fromJson(steps.retry_trigger.outputs.run_ids || '{}')[matrix.batch_id] }}
          ORCHESTRAI_V2_CI_API_URL: ${{ vars.ORCHESTRAI_V2_CI_API_URL }}
          ORCHESTRAI_V2_OIDC_AUDIENCE: ${{ vars.ORCHESTRAI_V2_OIDC_AUDIENCE }}
          ORCHESTRAI_V2_PORTAL_URL: ${{ vars.ORCHESTRAI_V2_PORTAL_URL }}
          ORCHESTRAI_V2_WORKSPACE: ${{ vars.ORCHESTRAI_V2_WORKSPACE }}
        run: python3 .github/scripts/orchestrai_trigger.py --cancel

      - name: Batch result
        if: always()
        env:
          BATCH_JSON: ${{ toJson(matrix) }}
        # Fails only when a required playbook did not pass (after any retry); with
        # nothing required, when any playbook did not (continue-on-error above).
        run: python3 .github/scripts/orchestrai_batch_verdict.py --exit-code test-results/batch.json

      - name: Upload test artifacts
        if: always()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: batch-results-${{ strategy.job-index }}-${{ matrix.locale && format('{0}-', matrix.locale) || '' }}${{ matrix.platform }}-${{ matrix.arch }}
          path: test-results/
          if-no-files-found: ignore

  playbook-results:
    # PASS / FAIL / NOT RUN for each system (device + OS), then the full gate.
    name: Results by Device
    needs: [detect-and-trigger, test-batches]
    if: always() && needs.detect-and-trigger.outputs.has_entries == 'true'
    runs-on: ${{ vars.ORCHESTRAI_CONTROL_RUNNER || 'ubuntu-latest' }}
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6.1.0
      - uses: actions/download-artifact@37930b1c2abaa49bbe596cd826c3c89aef350131 # v7.0.0
        with:
          pattern: batch-results-*
          path: batch-results
      - name: Each system's result
        env:
          # Every batch that should report: one without an artifact is NO RESULTS.
          EXPECTED_BATCHES: ${{ needs.detect-and-trigger.outputs.batch_matrix }}
        run: python3 .github/scripts/orchestrai_batch_verdict.py --merge batch-results

  test-gate:
    name: Test Gate (Required)
    needs: [detect-and-trigger, test-batches, playbook-results]
    if: always()
    runs-on: ${{ vars.ORCHESTRAI_CONTROL_RUNNER || 'ubuntu-latest' }}
    steps:
      - name: Check required tests
        run: |
          echo "detect-and-trigger: ${{ needs.detect-and-trigger.result }}"
          echo "batches:            ${{ needs.test-batches.result }}"
          # A failure or cancellation in detect/matrix/trigger skips the batch
          # jobs, so require success here rather than checking only "failure".
          if [ "${{ needs.detect-and-trigger.result }}" != "success" ]; then
            echo "::error::Detect/trigger did not succeed — the pipeline did not run"; exit 1
          fi
          # A batch job fails only when one of its required playbooks did not
          # pass (batches with nothing required are continue-on-error).
          if [ "${{ needs.detect-and-trigger.outputs.has_entries }}" = "true" ] \
             && [ "${{ needs.test-batches.result }}" != "success" ]; then
            echo "::error::Required playbooks did not all pass — see Results by Device"; exit 1
          fi
          echo "All required tests passed (or none were needed)"
