name: Bug report
description: Report a problem with a specific playbook in this repository.
title: "[Bug]: <short description>"
labels: ["bug", "status::triage"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for taking the time to file a bug report!

        This tracker covers the **playbooks in this repository**: a step that does
        not work, a command that fails, output that does not match what the
        playbook says to expect, a broken link, or content that is out of date.

        **Before you continue:**
        - Please search [existing issues](https://github.com/amd/playbooks/issues)
          to make sure this hasn't already been reported.
        - If the tool the playbook uses fails the same way *outside* of the
          playbook steps, the bug is probably in that tool. Please report it to
          that project's own tracker so its maintainers see it.
        - For general questions or discussion, join the
          [AMD Developer Discord](https://discord.com/invite/amd-dev).

  - type: dropdown
    id: playbook
    attributes:
      label: Which playbook is this about?
      description: |
        Listed by directory name under `playbooks/`, matching the titles on
        [amd.com/playbooks](https://amd.com/playbooks).
      options:
        # BEGIN generated by .github/scripts/gen_issue_template_playbooks.py
        - "amd-sync - Remote Development with AMD Sync"
        - "clustering-rccl - Clustering Two Ryzen™ AI Halos with RCCL"
        - "clustering-rpc-server - Clustering Two Ryzen™ AI Halos with RPC"
        - "comfyui-image-gen - Generating Images with ComfyUI and Z Image Turbo"
        - "cvml - Local Computer Vision with AMD Ryzen™ AI NPU"
        - "deepseek-v4-flash-ds4 - Running DeepSeek V4 Flash with ds4"
        - "gaia-agents - Building Your First Agent with GAIA"
        - "github-slack-development-digest - Build a GitHub-to-Slack Development Digest with Agent Canvas"
        - "hermes-lemonade-server - Running Hermes Agent Locally with Lemonade Server"
        - "lemonade-getting-started - Getting Started with Lemonade"
        - "llama-factory-finetuning - Fine-Tuning LLMs with LLaMA Factory"
        - "lmstudio-rocm-llms - Running and Serving LLMs with LM Studio"
        - "n8n-automation-gpt-oss - Automating Workflows with n8n and Local LLMs"
        - "ollama-getting-started - Getting Started with Ollama"
        - "open-webui-chat - Chatting with LLMs in Open WebUI"
        - "openclaw-lemonade-server - Running OpenClaw Locally with Lemonade Server"
        - "openhands-getting-started - Getting Started with OpenHands and a Local LLM"
        - "pytorch-finetuning - Fine-Tuning LLMs with PyTorch and AMD ROCm™ Software"
        - "pytorch-kernels - Building Custom GPU Kernels with PyTorch and AMD ROCm™"
        - "pytorch-rocm-llms - Running LLMs on PyTorch with AMD ROCm™ Software"
        - "speech2speech-translation - Real-Time Speech-to-Speech Translation"
        - "unsloth-llms-finetuning - Fine-Tuning LLMs with Unsloth"
        - "vllm-inference - Getting Started with vLLM"
        - "vscode-qwen3-coder - Local LLM Coding with VSCode and Qwen3-Coder"
        # END generated
        - Something else (the website, repository tooling, or a playbook not listed)
    validations:
      required: true

  - type: input
    id: step
    attributes:
      label: Which step or section fails?
      description: |
        The heading, step number, or command where the playbook stops working.
        This is the single most useful field for reproducing the problem.
      placeholder: e.g. "Install the dependencies" -> the `pip install -r requirements.txt` command
    validations:
      required: true

  - type: dropdown
    id: device
    attributes:
      label: AMD hardware
      description: |
        Which device are you following the playbook on? These are the device IDs
        the playbooks use. Select every one you have reproduced the problem on.
      multiple: true
      options:
        - halo_box - AMD Ryzen AI Halo Developer Platform
        - halo - AMD Ryzen AI Max+
        - stx - AMD Ryzen AI 300 HX
        - krk - AMD Ryzen AI 300
        - rx7900xt - AMD Radeon RX 7900 XT
        - rx9070xt - AMD Radeon RX 9070 XT
        - r9700 - AMD Radeon AI PRO R9700
        - Other AMD hardware (describe below)
    validations:
      required: true

  - type: input
    id: hardware-details
    attributes:
      label: Hardware details
      description: |
        Exact product name, and system model if relevant. Required if you
        selected "Other AMD hardware" above.
      placeholder: e.g. Ryzen AI Max+ 395, 128 GB, HP ZBook Ultra G1a
    validations:
      required: false

  - type: dropdown
    id: os
    attributes:
      label: Operating system
      description: Select every OS you have reproduced the problem on.
      multiple: true
      options:
        - Windows
        - Linux
        - WSL2 on Windows
    validations:
      required: true

  - type: input
    id: os-version
    attributes:
      label: Operating system version
      description: |
        - Windows: e.g. `Windows 11 24H2 (Build 26100.2314)`
        - Linux: output of `lsb_release -a` or contents of `/etc/os-release`
      placeholder: e.g. Ubuntu 24.04.1 LTS / Windows 11 24H2 (26100.2314)
    validations:
      required: true

  - type: input
    id: driver-runtime
    attributes:
      label: Driver / runtime versions
      description: |
        Versions of whatever the playbook depends on, so we can match your
        environment. Include the GPU or NPU driver, plus the runtime the
        playbook installs (ROCm, Ryzen AI, Lemonade, PyTorch, and so on).
      placeholder: e.g. Adrenalin 25.6.3, ROCm 6.4.0, torch 2.8.0
    validations:
      required: false

  - type: textarea
    id: what-happened
    attributes:
      label: What happened?
      description: A clear and concise description of the bug.
      placeholder: Describe the actual behavior you observed.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: What did you expect to happen?
      placeholder: Describe what you expected the playbook step to do.
    validations:
      required: true

  - type: textarea
    id: repro
    attributes:
      label: Steps to reproduce
      description: |
        List the exact steps from the playbook that lead to the bug, starting
        from a clean environment where you can.
      placeholder: |
        1. Go to step '...' of the playbook
        2. Run command '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Relevant logs, error messages, or screenshots
      description: |
        Paste any relevant terminal output, stack traces, or screenshots.
        Logs will be automatically formatted as code, no need for backticks.
      render: shell
    validations:
      required: false

  - type: textarea
    id: additional
    attributes:
      label: Additional context
      description: Anything else that might help us reproduce or diagnose the issue.
    validations:
      required: false
